<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Login - EstiloSaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 font-sans text-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white text-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black tracking-wider text-amber-500">EstiloSaaS</h1>
            <p class="text-slate-500 text-sm mt-1">Acesse o painel da sua barbearia</p>
        </div>

        <div id="alertErro" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl font-medium text-center">
            Usuário ou senha incorretos.
        </div>

        <form id="formLogin" class="space-y-5">
            <div>
                <label for="usuario" class="block text-sm font-semibold text-slate-600 mb-1">Usuário</label>
                <input type="text" id="usuario" name="username" autocomplete="username" required 
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition" 
                       placeholder="Seu usuário">
            </div>
            <div>
                <label for="senha" class="block text-sm font-semibold text-slate-600 mb-1">Senha</label>
                <input type="password" id="senha" name="password" autocomplete="current-password" required 
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition" 
                       placeholder="••••••••">
            </div>
            <button type="submit" id="btnSubmit" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-slate-800 transition shadow-md shadow-slate-900/10 flex items-center justify-center gap-2">
                <span>Entrar no Painel</span>
            </button>
        </form>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;
            const alertErro = document.getElementById('alertErro');
            const btnSubmit = document.getElementById('btnSubmit');

            alertErro.classList.add('hidden');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = 'Conectando...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    window.location.href = 'relatorios.html';
                } else {
                    alertErro.innerText = data.message || 'Usuário ou senha incorretos.';
                    alertErro.classList.remove('hidden');
                }
            } catch (error) {
                alertErro.innerText = 'Erro ao conectar com o servidor. Tente novamente.';
                alertErro.classList.remove('hidden');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = 'Entrar no Painel';
            }
        });
    </script>
</body>
</html>
